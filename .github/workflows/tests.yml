name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run the checker on the sample workflows
        # Exit code 1 is expected here: one sample has high findings.
        run: |
          python workflow_checker.py sample_workflows/01_risky.yml || test $? -eq 1
      - name: Check this repo's own workflow
        # No high findings expected, so the exit code must be 0.
        run: python workflow_checker.py .github/workflows/tests.yml
